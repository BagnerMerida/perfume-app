<div class="empty-state">
  <div class="empty-state-icon">
    <mat-icon>{{ icon }}</mat-icon>
  </div>

  <h2 class="empty-state-title">{{ title }}</h2>

  <p class="empty-state-description" *ngIf="description">
    {{ description }}
  </p>

  <app-button
    *ngIf="actionLabel"
    variant="primary"
    [icon]="actionIcon"
    iconPosition="start"
    (clicked)="onActionClick()"
  >
    {{ actionLabel }}
  </app-button>
</div>
