<header class="navbar">
  <div class="navbar-inner">
    <!-- Logo -->
    <a
      class="logo"
      routerLink="/"
      (click)="closeMenu()"
    >
      
      <span>Perfumería</span>
    </a>

    <!-- Links desktop -->
    <nav class="nav-links">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >Inicio</a>
      <a
        routerLink="/catalog"
        routerLinkActive="active"
        (click)="closeMenu()"
      >Catálogo</a>
      <a
        routerLink="/admin/products/new"
        routerLinkActive="active"
        class="admin-link"
        (click)="closeMenu()"
      >
        <mat-icon>shield</mat-icon>
        <span>Admin</span>
      </a>
    </nav>

    <!-- Acciones derecha -->
    <div class="actions">
      <!-- Carrito -->
      <button
        class="cart-btn"
        (click)="goToCart()"
        [attr.aria-label]="'Carrito (' + cartCount + ' productos)'"
      >
        <mat-icon>shopping_cart</mat-icon>
        @if (cartCount > 0) {
          <span class="cart-badge">{{ cartCount > 99 ? '99+' : cartCount }}</span>
        }
      </button>

      <!-- Hamburguesa -->
      <button
        class="hamburger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-label="Menú"
      >
        @if (menuOpen) {
          <mat-icon>close</mat-icon>
        } @else {
          <mat-icon>menu</mat-icon>
        }
      </button>
    </div>
  </div>

  <!-- Menú mobile -->
  @if (menuOpen) {
    <div class="mobile-menu">
      <nav class="mobile-nav">
        <a
          routerLink="/"
          routerLinkActive="mobile-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >Inicio</a>
        <a
          routerLink="/catalog"
          routerLinkActive="mobile-active"
          (click)="closeMenu()"
        >Catálogo</a>
        <div class="mobile-divider"></div>
        <a
          routerLink="/admin/products/new"
          class="mobile-admin"
          (click)="closeMenu()"
        >
          <mat-icon>shield</mat-icon>
          Panel Administrador
        </a>
      </nav>
    </div>
  }
</header>
