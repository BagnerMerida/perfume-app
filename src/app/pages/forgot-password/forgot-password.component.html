<div class="forgot-container">

    <mat-card class="forgot-card">

        <h1>Recuperar contraseña</h1>

        <p>
            Ingresa tu usuario administrador y enviaremos un enlace al correo registrado.
        </p>

        @if (message) {
        <div class="success">
            {{ message }}
        </div>
        }

        @if (errorMessage) {
        <div class="error">
            {{ errorMessage }}
        </div>
        }

        <mat-form-field appearance="outline">
            <mat-label>Usuario</mat-label>
            <input matInput [(ngModel)]="username" (keyup.enter)="sendRecoveryEmail()">
        </mat-form-field>

        <button mat-raised-button color="primary" [disabled]="loading" (click)="sendRecoveryEmail()">
            Enviar correo
        </button>

        <a routerLink="/login">
            Volver al login
        </a>

    </mat-card>

</div>
