<div class="login-screen">
  <div class="login-overlay"></div>
  <div class="login-container">
    <mat-card class="login-card">
      <h1>Recuperar contraseña</h1>
      <p>Ingresa tu usuario administrador y te enviaremos un enlace al correo registrado.</p>

      <div *ngIf="message" class="login-success">
        {{ message }}
      </div>

      <div *ngIf="errorMessage" class="login-error">
        {{ errorMessage }}
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Usuario</mat-label>
        <input
          matInput
          name="username"
          autocomplete="username"
          [(ngModel)]="username"
          placeholder="Ej. admin"
          (keyup.enter)="sendRecoveryEmail()"
        />
      </mat-form-field>

      <button mat-raised-button color="primary" [disabled]="loading" (click)="sendRecoveryEmail()">
        Enviar correo
      </button>

      <a routerLink="/login">Volver al login</a>
    </mat-card>
  </div>
</div>
