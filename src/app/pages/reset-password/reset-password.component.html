<div class="reset-container">

    <mat-card class="reset-card">

        <h1>Nueva contraseña</h1>

        <p>
            Ingresa tu nueva contraseña para recuperar el acceso administrador.
        </p>

        @if (message) {
        <div class="success">
            {{ message }}
        </div>
        }

        @if (errorMessage) {
        <div class="error">
            {{ errorMessage }}
        </div>
        }

        <mat-form-field appearance="outline">
            <mat-label>Nueva contraseña</mat-label>
            <input matInput type="password" [(ngModel)]="newPassword">
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Confirmar contraseña</mat-label>
            <input matInput type="password" [(ngModel)]="confirmPassword" (keyup.enter)="resetPassword()">
        </mat-form-field>

        <button mat-raised-button color="primary" [disabled]="loading" (click)="resetPassword()">
            Cambiar contraseña
        </button>

        <a routerLink="/login">
            Volver al login
        </a>

    </mat-card>

</div>
